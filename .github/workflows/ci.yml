name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: bash -n install.sh
      - run: docker compose config --quiet
        env:
          MROW_PUBLIC_URL: http://192.168.1.20:3080
          MROW_ALLOWED_ORIGINS: http://192.168.1.20:3080
          MROW_ALLOW_INSECURE_HTTP: "true"
          MROW_CASAOS_SCHEME: http
          MROW_CASAOS_HOSTNAME: 192.168.1.20
          MROW_CASAOS_PORT: "3080"
          MROW_SETUP_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MROW_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MROW_SESSION_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          MROW_WORKER_PASSWORD: cccccccccccccccccccccccc
          MROW_SEARXNG_SECRET: dddddddddddddddddddddddddddddddd

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: app
            file: Dockerfile
          - name: worker
            file: browser/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/mrowsearch-${{ matrix.name }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
