use_default_settings: true
server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false
  method: "POST"
search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json
outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
enabled_plugins:
  - "Hash plugin"
  - "Self Information"
  - "Tracker URL remover"
logging:
  level: WARNING
