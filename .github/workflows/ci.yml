name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MROW_PUBLIC_URL: http://127.0.0.1:3080
      MROW_ALLOWED_ORIGINS: http://127.0.0.1:3080
      MROW_ALLOW_INSECURE_HTTP: "true"
      MROW_CASAOS_SCHEME: http
      MROW_CASAOS_HOSTNAME: 127.0.0.1
      MROW_CASAOS_PORT: "3080"
      MROW_SETUP_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      MROW_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MROW_SESSION_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      MROW_WORKER_PASSWORD: cccccccccccccccccccccccc
      MROW_SEARXNG_SECRET: dddddddddddddddddddddddddddddddd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: bash -n install.sh
      - run: bash -n browser/custom_startup.sh
      - run: docker build --tag mrowsearch-app:1.0.0 .
      - run: docker build --file browser/Dockerfile --tag mrowsearch-worker:1.0.0 .
      - run: docker compose config --quiet
      - run: docker compose up --detach --no-build
      - run: |
          for attempt in $(seq 1 120)
          do
            if curl -fsS http://127.0.0.1:3080/health/ready >/dev/null
            then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=120 mrow-app mrow-browser-1
          exit 1
      - if: always()
        run: docker compose down --volumes --remove-orphans

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: app
            file: Dockerfile
          - name: worker
            file: browser/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/mrowsearch-${{ matrix.name }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
